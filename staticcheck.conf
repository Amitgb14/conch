# staticcheck's defaults, less two that disagree with how conch is written.
#
# ST1005: conch's errors are what a person reads — "Run conch machine
#   upgrade." — so they are sentences, capitalised and punctuated.
# S1016: a struct literal copying one wire type's fields into another's
#   keeps the two separate types; a conversion stops compiling the moment
#   either gains a field, which is the point of them being two types.
checks = ["inherit", "-ST1005", "-S1016"]
