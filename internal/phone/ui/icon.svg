<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="lip" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffe1cc"/>
      <stop offset="0.5" stop-color="#f9a594"/>
      <stop offset="1" stop-color="#e96a7f"/>
    </linearGradient>
    <radialGradient id="mouth" cx="0.66" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9446a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f58f93" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#f9e0b4"/>
      <stop offset="0.55" stop-color="#eab274"/>
      <stop offset="1" stop-color="#cf8744"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="1" stop-color="#f1d3a6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round">
    <!-- flared pink lip -->
    <path d="M24 32 C27 17 37 6 47 6 C63 7 81 23 88 44 C92 55 92 65 90 72 L86 67 C74 52 58 38 43 28 Z"
      fill="url(#lip)" stroke="#c9536b" stroke-width="1.2"/>
    <path d="M42 26 C52 20 66 26 76 40 C82 49 85 58 86 64 C75 51 60 38 46 30 Z" fill="url(#mouth)"/>
    <!-- body whorl -->
    <path d="M25 33 C29 28 33 25 35 24 L37 16 L41 26 C45 28 49 30 52 32 C66 42 79 54 88 65 C92 70 93 75 89 79 C86 81 81 81 78 77 C69 74 57 73 45 76 C41 78 38 83 36 88 C34 90 31 89 31 85 C31 80 30 74 27 70 C24 66 22 62 21 57 Z"
      fill="url(#body)" stroke="#a8652f" stroke-width="1.2"/>
    <!-- growth lines -->
    <path d="M41 34 C54 42 68 54 80 68 M35 45 C48 51 61 61 71 72 M31 58 C41 62 51 67 59 73" fill="none" stroke="#b87538" stroke-width="1" stroke-linecap="round" opacity=".5"/>
    <!-- knobbed spire pointing left -->
    <path d="M29 30 L27 26.5 L24.5 31 L21 31 L19.5 28 L17 32.5 L13.5 33.5 L12 31 L10.5 35 C8.5 35.7 6.5 36.5 4.5 37.5 C6 39.5 8 41 10 42 L10.5 45.5 L13 43.5 L16 46 L16.5 49.5 L19.5 48.5 L21.5 52.5 L24 50.5 L27 54 C26.5 46 27 38 29 30 Z"
      fill="url(#spire)" stroke="#b58250" stroke-width="1.1"/>
    <path d="M9 38.5 C14 39.5 20 40.5 27 41" fill="none" stroke="#c99a66" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
    <!-- lower body spikes -->
    <path d="M25 59 L18.5 62.5 L25.5 64.5 Z M27.5 68 L22 73 L29 72.5 Z" fill="#efc88f" stroke="#a8652f" stroke-width="1"/>
  </g>
</svg>
