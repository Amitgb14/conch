name: pages

# Builds the website in web/ and publishes it to GitHub Pages at
# https://amitgb14.github.io/conch/.
on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pages.yml"]
    # A release changes the version the site shows. For this to deploy and
    # not just build, the github-pages environment needs a deployment branch
    # policy allowing the v* tag; with only the master branch allowed, the
    # deploy job is rejected by protection rules.
    tags: ["v*"]
  # A pull request that touches the site is built and linted, not deployed,
  # so a broken page is found before it merges rather than after.
  pull_request:
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Only the deploy job may write to Pages; a pull request's build gets none.
permissions:
  contents: read

# Deploys queue one after another; a pull request's builds replace its own
# earlier one and never wait behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the header shows the latest release
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          BASE_PATH: /conch
      # Serve the _next folder as is.
      - run: touch out/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://amitgb14.github.io/conch/
    steps:
      - uses: actions/deploy-pages@v4
