name: pages

# Builds the website in web/ and publishes it to GitHub Pages at
# https://amitgb14.github.io/conch/.
on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pages.yml"]
    tags: ["v*"] # a release changes the version the site shows
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags: the header shows the latest release
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
        env:
          BASE_PATH: /conch
      # Serve the _next folder as is.
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://amitgb14.github.io/conch/
    steps:
      - uses: actions/deploy-pages@v4
