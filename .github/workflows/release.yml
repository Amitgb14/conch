name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Every platform is built here, which means macOS is built without
      # cgo: those binaries watch worktrees by kqueue rather than
      # FSEvents, and so mostly poll. A mac build made on a mac (`make
      # release`) has FSEvents, and its archives differ from these.
      - run: scripts/release.sh "${GITHUB_REF_NAME}"
      # Publish, whether or not the release is already there. A tag can
      # arrive twice — moved to re-cut a version, or pushed after the
      # release was made by hand — and `gh release create` exits 1 on
      # the second, which failed this workflow twice on v0.1.7 and
      # published nothing. Notes somebody wrote are left alone: only the
      # archives are replaced.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: replacing its archives, keeping its notes"
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --generate-notes
          fi
      # Homebrew: the formula for these archives, committed to the tap so
      # `brew install Amitgb14/conch/conch` and `brew upgrade` find it.
      # It needs the HOMEBREW_TAP_TOKEN secret, a token that may push to
      # Amitgb14/homebrew-conch; without it the step says so and the
      # release stands. A pre-release (a tag with a -) is not offered to
      # brew users.
      - name: Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG" in *-*) echo "::notice::$TAG is a pre-release: the formula stays as it is"; exit 0 ;; esac
          scripts/brew-formula.sh "$TAG" dist/checksums.txt > conch.rb
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: the Homebrew formula was not published"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Amitgb14/homebrew-conch.git" tap
          mkdir -p tap/Formula
          cp conch.rb tap/Formula/conch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/conch.rb
          if git diff --cached --quiet; then
            echo "the formula is unchanged"
            exit 0
          fi
          git commit -m "conch ${TAG#v}"
          git push origin HEAD
