name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The suite, as `go test -race -count=1 -timeout 20m ./...` runs it, in
  # pieces on machines of their own (scripts/test.sh's PART). internal/server's
  # ~580 tests run one at a time and took ~16 of the job's 21 minutes on
  # the macOS runner, while everything else was done in four, so it is
  # dealt into shards beside a job for the rest.
  #
  # macOS gets fewer jobs than Linux: an account runs at most five macOS
  # jobs at once (twenty on Linux), shared by every run in flight, and a
  # job past that waits in the queue. So there it is three test jobs —
  # two shards side by side in each, on a runner with three cores — and
  # swift's, four in all.
  #
  # For each system, every part with that system's shards is the whole
  # suite once; TestCIRunsEveryPart keeps this list honest. make lint
  # (gofmt, go vet, staticcheck) runs in each system's rest job: each
  # builds files the other doesn't (FSEvents and peer_darwin on macOS,
  # fsnotify and peer_linux on Linux).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shards: 5, part: "rest" }
          - { os: ubuntu-latest, shards: 5, part: "server-1" }
          - { os: ubuntu-latest, shards: 5, part: "server-2" }
          - { os: ubuntu-latest, shards: 5, part: "server-3" }
          - { os: ubuntu-latest, shards: 5, part: "server-4" }
          - { os: ubuntu-latest, shards: 5, part: "server-5" }
          - { os: macos-latest, shards: 4, part: "rest" }
          - { os: macos-latest, shards: 4, part: "server-1,server-2" }
          - { os: macos-latest, shards: 4, part: "server-3,server-4" }
    runs-on: ${{ matrix.os }}
    env:
      SHARDS: ${{ matrix.shards }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The phone's app and the settings page are tested with node
      # (TestUILogic). Under CI a missing node fails those tests rather
      # than skipping them (internal/nodetest), so it is installed here
      # instead of trusting the runner image to have one.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.part == 'rest'
        run: make lint
      - run: scripts/test.sh

  # Conch.app (macos/) is Swift, which go test never builds. swift test
  # builds every target — ConchApp too, not only what ConchKitTests
  # imports — so a change that breaks the app's compile fails here rather
  # than on master: a duplicate declaration from two merged pull requests
  # once did. No Ghostty library on the runner, so it builds the SwiftTerm
  # side of TerminalHost; GhosttyHost.swift is checked locally.
  swift:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          # The packages it fetches (SwiftTerm), not the build itself.
          path: |
            macos/.build/checkouts
            macos/.build/repositories
          key: swiftpm-${{ runner.os }}-${{ hashFiles('macos/Package.resolved') }}
      - run: swift test

  # The settings page is committed as built (internal/configweb/dist) so
  # conch builds with go alone. Rebuilding it here says whether what is
  # committed is still the build of app/.
  settings-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: internal/configweb/app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: internal/configweb/app/pnpm-lock.yaml
      - run: make settings-ui-check

  # conch-ui (ui/) is committed as built too, as Swift for Conch.app:
  # its logic tested with node, then rebuilt and compared.
  conch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: make conch-ui-check
