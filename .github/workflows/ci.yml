name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # internal/server alone takes 500-550s on the macOS runner, which
      # left go test's default 10m timeout one slow runner from failing a
      # pull request that never touched it.
      - run: go test -race -timeout 20m ./...
