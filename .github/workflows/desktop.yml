name: desktop

# The desktop app is its own Go module (desktop/), built with cgo against
# the system webview, so it has its own workflow: ci.yml's go vet and
# go test ./... never reach it and need no WebKitGTK.
on:
  push:
    branches: [master]
    paths: ["desktop/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "internal/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Test
        working-directory: desktop
        run: |
          tags=desktop,production
          [ "$RUNNER_OS" = Linux ] && tags=$tags,webkit2_41
          [ "$RUNNER_OS" = macOS ] && export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          test -z "$(gofmt -l .)"
          go vet -tags "$tags" ./...
          go test -race -count=1 -tags "$tags" ./...
      - name: Build
        run: desktop/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: conch-desktop-${{ runner.os }}
          path: |
            desktop/dist/conch.app
            desktop/dist/*.tar.gz
